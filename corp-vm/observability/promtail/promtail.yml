server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: boundary-audit
    static_configs:
      - targets: [localhost]
        labels: { job: boundary, __path__: /var/log/boundary/audit.jsonl }
    pipeline_stages:
      - json:
          expressions:
            decision: decision
            host: host
            user: user
            dest: destination_class
            masked: masked_entities
      - labels: { decision: "", host: "", dest: "" }
  - job_name: suricata
    static_configs:
      - targets: [localhost]
        labels: { job: suricata, __path__: /var/log/suricata/eve.json }
