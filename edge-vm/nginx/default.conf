map $host $pool {
    default                 mock_llm;
    chat.openai.com         shadow_ui;
    chatgpt.com             shadow_ui;
    claude.ai               shadow_ui;
    gemini.google.com       shadow_ui;
    copilot.microsoft.com   shadow_ui;
}

upstream mock_llm  { server mock-llm:8080; }
upstream shadow_ui { server shadow-ui:80;  }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;

    location ~ ^/(v1|v1beta|api|healthz|receipts) {
        proxy_pass       http://mock_llm;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass       http://$pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
